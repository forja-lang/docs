name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Descargar WASM playground de la última versión
        continue-on-error: true
        run: |
          curl -sL \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_bg.wasm \
            -o src/wasm/forja_wasm_bg.wasm
          curl -sL \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm.js \
            -o src/wasm/forja_wasm.js
          curl -sL \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui_bg.wasm \
            -o src/wasm/forja_wasm_gui_bg.wasm
          curl -sL \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui.js \
            -o src/wasm/forja_wasm_gui.js
      - name: Verify WASM files (fallback to local if download failed)
        run: |
          # Un wasm válido empieza con los bytes mágicos \0asm (0061736d).
          for pair in "forja_wasm.js forja_wasm_bg.wasm" "forja_wasm_gui.js forja_wasm_gui_bg.wasm"; do
            set -- $pair
            js="$1"
            wasm="$2"
            magic=$(head -c 4 "src/wasm/$wasm" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ ! -s "src/wasm/$js" ] || [ ! -s "src/wasm/$wasm" ] || [ "$magic" != "0061736d" ] || ! grep -q "export" "src/wasm/$js"; then
              echo "⚠️  $js/$wasm inválido o descarga fallida, restaurando desde git..."
              git checkout -- "src/wasm/$js" "src/wasm/$wasm" 2>/dev/null || true
            fi
          done
          missing=0
          for f in src/wasm/forja_wasm.js src/wasm/forja_wasm_bg.wasm \
                   src/wasm/forja_wasm_gui.js src/wasm/forja_wasm_gui_bg.wasm; do
            if [ ! -s "$f" ]; then
              echo "❌ Missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error title=WASM faltante::Faltan archivos WASM y git tampoco los tiene."
            exit 1
          fi
          echo "✅ All WASM files ready"

      - name: Verificar inicialización del WASM
        run: |
          if ! node scripts/verificar-wasm.mjs; then
            # El fallback deja el sitio en pie, pero es un síntoma: el WASM del
            # release no inicializa. Marcarlo en el run y en el resumen para que
            # no pase desapercibido (antes sólo quedaba un ⚠️ en el log).
            echo "::warning title=WASM del release roto::El WASM descargado del release no inicializa; el playground se publica con la copia de git."
            {
              echo "### ⚠️ WASM del release no inicializa"
              echo ""
              echo "Se publicó la copia de git. Revisar el paso wasm-opt del workflow"
              echo "de release (faltan features: reference-types, multivalue)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️  El WASM descargado no inicializa; restaurando la versión de git..."
            git checkout -- src/wasm/forja_wasm.js src/wasm/forja_wasm_bg.wasm \
                             src/wasm/forja_wasm_gui.js src/wasm/forja_wasm_gui_bg.wasm 2>/dev/null || true
            # Si tampoco inicializa la copia de git, el deploy falla.
            node scripts/verificar-wasm.mjs
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
